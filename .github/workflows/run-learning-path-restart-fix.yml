name: Run learning path restart recovery fix
on:
  push:
    branches: [release/0.1-diagnostics]
permissions:
  contents: write
jobs:
  migrate:
    if: ${{ github.event.head_commit.message == 'Run learning path restart recovery fix' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.1-diagnostics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/_tmp_fix_learning_path_restart.py
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests/test_ege_learning_path.py tests/test_student_diagnostic_handler_flow.py tests/test_ege_tutor_pilot.py tests/test_pilot_full_telegram_loop.py tests/test_skill_graph.py
        env:
          BOT_TOKEN: 123456:TESTTOKEN
          PYTHONPATH: ${{ github.workspace }}
      - run: |
          rm scripts/_tmp_fix_learning_path_restart.py
          rm .github/workflows/run-learning-path-restart-fix.yml
          git config user.name 'nikitinti-gif'
          git config user.email 'nikitinti@gmail.com'
          git add -A
          git commit -m 'Recover progressive learning path after restart'
          git push origin HEAD:release/0.1-diagnostics
