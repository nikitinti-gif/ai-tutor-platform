name: Run task14 learning path pilot command
on:
  push:
    branches: [release/0.1-diagnostics]
permissions:
  contents: write
jobs:
  migrate:
    if: ${{ github.event.head_commit.message == 'Run task14 learning path pilot command' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.1-diagnostics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/_tmp_add_task14_learning_path_pilot.py
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests/test_ege_learning_path.py tests/test_ege_tutor_pilot.py tests/test_student_diagnostic_handler_flow.py
        env:
          BOT_TOKEN: 123456:TESTTOKEN
          PYTHONPATH: ${{ github.workspace }}
      - run: |
          rm scripts/_tmp_add_task14_learning_path_pilot.py
          rm .github/workflows/run-task14-learning-path-pilot.yml
          git config user.name 'nikitinti-gif'
          git config user.email 'nikitinti@gmail.com'
          git add -A
          git commit -m 'Add direct pilot for progressive task14 learning path'
          git push origin HEAD:release/0.1-diagnostics
