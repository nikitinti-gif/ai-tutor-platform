name: Run EGE task-mode separation
on:
  push:
    branches: [release/0.1-diagnostics]
permissions:
  contents: write
jobs:
  migrate:
    if: ${{ github.event.head_commit.message == 'Run EGE task-mode separation' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.1-diagnostics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/_tmp_split_ege_task_modes.py
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests/test_skill_graph.py tests/test_ege_tutor_pilot.py tests/test_pilot_full_telegram_loop.py tests/test_ege_diagnostics.py tests/test_task27_remediation.py
        env:
          BOT_TOKEN: 123456:TESTTOKEN
          PYTHONPATH: ${{ github.workspace }}
      - run: |
          rm scripts/_tmp_split_ege_task_modes.py
          rm .github/workflows/run-task-mode-split.yml
          git config user.name 'nikitinti-gif'
          git config user.email 'nikitinti@gmail.com'
          git add -A
          git commit -m 'Separate reasoning, application and programming EGE tasks'
          git push origin HEAD:release/0.1-diagnostics
