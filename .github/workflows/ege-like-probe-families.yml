name: One-shot EGE-like probe families
on:
  push:
    branches: [release/0.1-diagnostics]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot EGE-like probe family migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.1-diagnostics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply pedagogical family migration
        run: |
          python - <<'PY'
          from pathlib import Path

          prompts = Path('src/ai_engine/prompts.py')
          text = prompts.read_text(encoding='utf-8')
          start = text.index('def build_live_diagnostic_probe_prompt(')
          new_func = r'''def build_live_diagnostic_probe_prompt(*, task_number: int, operation_index: int, skill_id: str, fields: dict[str, object], previous_prompts: list[str] | None = None) -> str:
    """Generate wording inside a teacher-authored EGE-like probe family."""
    previous = "\n".join(f"- {item}" for item in (previous_prompts or []))
    key = (task_number, operation_index)
    placeholders_by_operation = {
        (5, 0): ("source_number", "source_system", "target_system"),
        (5, 1): ("n",),
        (5, 2): ("binary", "suffix"),
        (5, 3): ("start", "limit", "expression", "boundary"),
        (14, 0): ("n", "base"),
        (14, 1): ("digit", "value"),
        (14, 2): ("remainders", "last_quotient"),
        (27, 0): ("points", "within_distance", "between_min"),
        (27, 1): ("sums",),
        (27, 2): ("labels", "target"),
        (27, 3): ("distances",),
    }
    families = {
        (5, 0): "Короткая задача на перевод одного числа между десятичной и двоичной системами. Проси только результат перевода.",
        (5, 1): "Дай готовое число N и спроси, какая ветка алгоритма выбирается по последнему биту его двоичной записи. Не проси выполнять весь алгоритм.",
        (5, 2): "Дай готовую двоичную строку и конкретный суффикс. Попроси записать строку после приписывания суффикса справа.",
        (5, 3): "Дай короткий диапазон целых N и уже заданное неравенство. Попроси найти наибольшее подходящее N.",
        (14, 0): "Как на уроке систем счисления: дано десятичное число и основание. Спроси только остаток от первого деления, ответ обычным десятичным числом.",
        (14, 1): "Дай цифру системы счисления и её числовое значение. Спроси, чётно ли именно числовое значение; ответ да/нет.",
        (14, 2): "Дай остатки в порядке их получения и последнее ненулевое частное. Попроси записать итоговую запись числа, читая остатки в обратном порядке и ставя последнее частное слева. Не спрашивай число 'элементов' или 'разрядов'.",
        (27, 0): "Мини-задача на кластеризацию: даны четыре точки, внутригрупповое расстояние и нижняя граница межгруппового расстояния. Попроси определить число явно разделённых кластеров по этим расстояниям.",
        (27, 1): "Дай суммы расстояний для кандидатов A, B, C. Попроси выбрать медоид как точку с минимальной суммой.",
        (27, 2): "Дай готовую последовательность меток кластеров и конкретную метку. Попроси посчитать точки с этой меткой.",
        (27, 3): "Дай расстояния от центра/медоида до точек кластера. Попроси найти максимальное расстояние.",
    }
    examples = {
        (5, 0): "Пример стиля: «Переведите число {source_number} из {source_system} системы в {target_system}. Запишите только результат.»",
        (5, 1): "Пример стиля: «Для N={n} определите ветку алгоритма по последнему биту двоичной записи: 0 или 1?»",
        (5, 2): "Пример стиля: «К двоичной строке {binary} припишите справа {suffix}. Какая строка получится?»",
        (5, 3): "Пример стиля: «Среди целых N от {start} до {limit} найдите наибольшее, для которого {expression} < {boundary}.»",
        (14, 0): "Пример стиля: «Число {n} переводят в систему с основанием {base}. Чему равен остаток от первого деления?»",
        (14, 1): "Пример стиля: «Цифра {digit} имеет числовое значение {value}. Является ли это значение чётным?»",
        (14, 2): "Пример стиля: «При переводе числа остатки получались в порядке: {remainders}. Последнее ненулевое частное — {last_quotient}. Запишите итоговую запись числа.»",
        (27, 0): "Пример стиля: «Даны точки {points}. Внутри предполагаемых групп расстояние не больше {within_distance}, между группами — не меньше {between_min}. Сколько кластеров выделяется?»",
        (27, 1): "Пример стиля: «Суммы расстояний до остальных точек: {sums}. Какая точка является медоидом?»",
        (27, 2): "Пример стиля: «Метки точек: {labels}. Сколько точек имеет метку {target}?»",
        (27, 3): "Пример стиля: «Расстояния от медоида: {distances}. Найдите максимальное расстояние.»",
    }
    placeholders = ", ".join("{" + name + "}" for name in placeholders_by_operation[key])
    preview = ", ".join(f"{name}={value}" for name, value in fields.items())
    allowed_constants = " Разрешены цифры 0 и 1 как названия веток." if key == (5, 1) else ""
    return f"""
Ты — опытный учитель информатики, готовящий ученика к КЕГЭ. Создай ОДНУ короткую диагностическую задачу, которая звучит как нормальное упражнение на уроке или в тренажёре ЕГЭ, а не как описание внутренностей AI Tutor.

Навык: {skill_id}.
Педагогическая семья: {families[key]}
{examples[key]}

Python уже создал и проверил данные: {preview}.
Верни только prompt_template.

Обязательные правила:
- используй каждый плейсхолдер ровно один раз: {placeholders};
- не добавляй никаких числовых данных от себя;{allowed_constants}
- не меняй математическую операцию и не добавляй второй шаг;
- вопрос должен быть понятен ученику без знания устройства Tutor;
- используй обычную терминологию школьной информатики и КЕГЭ;
- не используй мета-слова «значимые элементы», «показатель», «в рамках алгоритма», «представь, что у нас»;
- не сообщай ответ и не объясняй решение;
- длина до 260 символов, один явный вопрос.

Ранее показанные формулировки — не повторяй их близко:
{previous or 'нет'}

Верни только JSON:
{{"prompt_template": "..."}}.
""".strip()
'''
          text = text[:start] + new_func
          prompts.write_text(text, encoding='utf-8')

          diagnostics = Path('src/ai_engine/diagnostics.py')
          text = diagnostics.read_text(encoding='utf-8')
          text = text.replace(
              '{"id": "task14_count_all_digits_v2", "operation_index": 2, "prompt": "В цикле деления на 36 получены остатки 5, 0 и 2, после чего частное стало равно 1. Этот последний ненулевой разряд тоже нужно записать. Сколько всего цифр будет в записи числа?", "expected_answers": ("4",)},',
              '{"id": "task14_count_all_digits_v2", "operation_index": 2, "prompt": "При переводе числа остатки получались в порядке 5, 0, 2. Последнее ненулевое частное равно 1. Запишите итоговую запись числа.", "expected_answers": ("1205",)},',
          )
          text = text.replace(
              '{"id": "task27_clusters_v2", "operation_index": 0, "prompt": "Даны точки (0,0), (0,2), (8,8), (10,8). Внутри каждой пары расстояние равно 2, а между парами значительно больше. Сколько естественных кластеров образуют точки?", "expected_answers": ("2",)},',
              '{"id": "task27_clusters_v2", "operation_index": 0, "prompt": "Даны точки (0,0), (0,2), (8,8), (10,8). Внутри каждой пары расстояние равно 2, а между парами не меньше 8. Сколько явно разделённых кластеров получается по этим расстояниям?", "expected_answers": ("2",)},',
          )
          diagnostics.write_text(text, encoding='utf-8')

          service = Path('src/services/ege_exam_service.py')
          text = service.read_text(encoding='utf-8')
          old = '''    "BASE_MOST_SIGNIFICANT_DIGIT": {
        "explanation": (
            "Когда деление заканчивается, последнее ненулевое частное тоже "
            "становится цифрой записи. Его нельзя потерять."
        ),
        "example": (
            "Например, получены остатки 5, 0, 2, а последнее частное равно 1: "
            "в записи четыре цифры — 1, 2, 0, 5."
        ),
        "hint": "Посчитай все остатки и добавь к ним последнее ненулевое частное.",
        "control_prompt": (
            "Контроль: получены остатки 4 и 3, последнее ненулевое частное равно 2. "
            "Сколько цифр в записи?"
        ),
        "control_answers": ("3",),
        "retest_prompt": (
            "Возврат к заданию типа №14: получены остатки 5, 0 и 2, затем осталось "
            "частное 1. Сколько всего цифр в записи?"
        ),
        "retest_answers": ("4",),
        "verification_prompt": (
            "Независимая проверка: получены остатки 7, 1, 0 и 3, затем "
            "осталось частное 2. Сколько всего цифр в записи?"
        ),
        "verification_answers": ("5",),
    },'''
          new = '''    "BASE_MOST_SIGNIFICANT_DIGIT": {
        "explanation": (
            "При переводе делением остатки читают в обратном порядке, а последнее "
            "ненулевое частное ставят слева. Его нельзя потерять."
        ),
        "example": (
            "Например, остатки получались 5, 0, 2, а последнее частное равно 1. "
            "Читаем остатки наоборот и ставим 1 слева: получаем 1205."
        ),
        "hint": "Поставь последнее ненулевое частное слева, затем запиши остатки в обратном порядке.",
        "control_prompt": (
            "Контроль: остатки получались 4, 3; последнее ненулевое частное равно 2. "
            "Запиши итоговую запись числа."
        ),
        "control_answers": ("234",),
        "retest_prompt": (
            "Перенос: остатки получались 5, 0, 2; последнее ненулевое частное равно 1. "
            "Запиши итоговую запись числа."
        ),
        "retest_answers": ("1205",),
        "verification_prompt": (
            "Независимая проверка: остатки получались 7, 1, 0, 3; последнее "
            "ненулевое частное равно 2. Запиши итоговую запись числа."
        ),
        "verification_answers": ("23017",),
    },'''
          if old not in text:
              raise SystemExit('task14 remediation block not found')
          text = text.replace(old, new, 1)
          service.write_text(text, encoding='utf-8')

          tests = Path('tests/test_ege_diagnostics.py')
          text = tests.read_text(encoding='utf-8')
          text = text.replace(
              '(14, 2): ("Алгоритм получил {remainder_count} остатков, после чего осталось ненулевое частное. Сколько разрядов будет в записи?", [5]),',
              '(14, 2): ("Остатки получались в порядке {remainders}, последнее ненулевое частное — {last_quotient}. Какова итоговая запись числа?", [5]),',
          )
          text = text.replace(
              '(27, 0): ("На плоскости отмечены точки {points}. На сколько естественных групп-кластеров распадается набор?", [20, 8]),',
              '(27, 0): ("Даны точки {points}. Внутри групп расстояние не больше {within_distance}, между группами — не меньше {between_min}. Сколько кластеров выделяется?", [20, 8]),',
          )
          tests.write_text(text, encoding='utf-8')

          quality = Path('tests/test_probe_quality_gate.py')
          text = quality.read_text(encoding='utf-8')
          text = text.replace(
              'raw = json.dumps({"prompt_template": "После делений получено {remainder_count} остатков и осталось последнее ненулевое частное. Сколько цифр будет в итоговой записи?"}, ensure_ascii=False)\n    probe = build_live_probe(case, CONTROL_PROBES[14][2], raw, values=[4])\n    assert probe["expected_answers"] == ("5",)',
              'raw = json.dumps({"prompt_template": "Остатки получались в порядке {remainders}, последнее ненулевое частное — {last_quotient}. Какова итоговая запись числа?"}, ensure_ascii=False)\n    probe = build_live_probe(case, CONTROL_PROBES[14][2], raw, values=[4])\n    assert probe["expected_answers"] == ("1431",)',
          )
          addition = r'''


def test_live_prompt_families_use_current_python_fields_and_teacher_language():
    from src.ai_engine.live_diagnostic_probes import _scenario
    from src.ai_engine.prompts import build_live_diagnostic_probe_prompt

    cases = {
        (14, 2): {"values": [4]},
        (27, 0): {"values": [20, 8]},
    }
    for (task, op), data in cases.items():
        fields, _ = _scenario(task, op, data)
        prompt = build_live_diagnostic_probe_prompt(
            task_number=task,
            operation_index=op,
            skill_id="test.skill",
            fields=fields,
        )
        for field in fields:
            assert "{" + field + "}" in prompt
        assert "значимые элементы" not in prompt.lower()
'''
          if 'test_live_prompt_families_use_current_python_fields_and_teacher_language' not in text:
              text += addition
          quality.write_text(text, encoding='utf-8')

          Path('.github/workflows/ege-like-probe-families.yml').unlink()
          PY
      - name: Run pilot regression suite
        env:
          BOT_TOKEN: 123456:TESTTOKEN
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install -r requirements.txt pytest
          python -m py_compile src/ai_engine/prompts.py src/ai_engine/live_diagnostic_probes.py src/services/ege_exam_service.py
          pytest -q tests/test_pilot_diagnostic_flow.py tests/test_ege_diagnostics.py tests/test_student_diagnostic_handler_flow.py tests/test_pilot_learning_dna_flow.py tests/test_pilot_full_student_loop.py tests/test_pilot_full_telegram_loop.py tests/test_probe_quality_gate.py tests/test_diagnostic_evidence_integrity.py tests/test_task5_remediation.py tests/test_task27_remediation.py
      - name: Commit migration
        run: |
          git config user.name 'nikitinti-gif'
          git config user.email 'nikitinti@gmail.com'
          git add -A
          git commit -m 'Anchor pilot probes to EGE-like pedagogical families'
          git push origin HEAD:release/0.1-diagnostics
