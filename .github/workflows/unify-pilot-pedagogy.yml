name: One-shot unify pilot diagnostic pedagogy
on:
  push:
    branches: [release/0.1-diagnostics]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Unify pilot diagnostic pedagogy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.1-diagnostics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align hypotheses with atomic skills
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/ai_engine/diagnostics.py')
          text = p.read_text(encoding='utf-8')
          start = text.index('TASK14_GAPS = {')
          end = text.index('\n\n\ndef _gap_for_operation', start)
          replacement = '''PILOT_GAPS = {
    (5, 0): {
        "gap_id": "BINARY_BASE_CONVERSION",
        "description": "Ошибается при переводе числа между десятичной и двоичной системами.",
        "required_rule": "При переводе нужно сохранить числовое значение и получить корректную запись в целевой системе.",
    },
    (5, 1): {
        "gap_id": "LAST_BIT_BRANCH_SELECTION",
        "description": "Ошибается при выборе ветки алгоритма по младшему биту двоичной записи.",
        "required_rule": "Младший бит — крайняя правая цифра двоичной записи; именно она определяет ветку алгоритма.",
    },
    (5, 2): {
        "gap_id": "BINARY_SUFFIX_APPEND",
        "description": "Ошибается при приписывании заданных битов справа к двоичной записи.",
        "required_rule": "Приписать суффикс справа — значит сохранить исходную запись и добавить указанные биты в её конец.",
    },
    (5, 3): {
        "gap_id": "STRICT_INEQUALITY_INTEGER_BOUNDARY",
        "description": "Ошибается при выборе наибольшего целого, удовлетворяющего строгому неравенству.",
        "required_rule": "После решения строгого неравенства нужно выбрать крайнее целое значение, которое всё ещё удовлетворяет условию.",
    },
    (14, 0): {
        "gap_id": "BASE_REMAINDER_EXTRACTION",
        "description": "Ошибается при вычислении остатка от деления числа на основание системы счисления.",
        "required_rule": "На первом шаге перевода остаток вычисляется как N % base; ответ здесь — обычное десятичное число.",
    },
    (14, 1): {
        "gap_id": "BASE_DIGIT_VALUE_PROPERTY",
        "description": "Ошибается при определении свойства цифры по её числовому значению.",
        "required_rule": "Свойство цифры проверяют по её числовому значению, а не по виду символа; буквенные цифры тоже имеют числовое значение.",
    },
    (14, 2): {
        "gap_id": "BASE_MOST_SIGNIFICANT_DIGIT",
        "description": "Теряет последнее ненулевое частное при восстановлении записи числа в новой системе счисления.",
        "required_rule": "Последнее ненулевое частное становится старшей цифрой, а остатки записываются в обратном порядке.",
    },
    (27, 0): {
        "gap_id": "CLUSTER_COUNT_FROM_DISTANCE_SEPARATION",
        "description": "Не выделяет явно разделённые группы точек по сравнению расстояний между ними.",
        "required_rule": "Если расстояния внутри групп малы, а между группами существенно больше, такие группы рассматриваются как отдельные кластеры.",
    },
    (27, 1): {
        "gap_id": "MEDOID_BY_MINIMUM_DISTANCE_SUM",
        "description": "Ошибается при выборе медоида по минимальной сумме расстояний.",
        "required_rule": "Медоид — объект кластера с минимальной суммой расстояний до остальных объектов этого кластера.",
    },
    (27, 2): {
        "gap_id": "CLUSTER_LABEL_COUNT",
        "description": "Ошибается при подсчёте объектов с заданной меткой кластера.",
        "required_rule": "Нужно учитывать только объекты, чья метка точно совпадает с заданной.",
    },
    (27, 3): {
        "gap_id": "MAX_CLUSTER_DISTANCE",
        "description": "Ошибается при выборе максимального расстояния из вычисленных значений.",
        "required_rule": "После вычисления требуемых расстояний нужно выбрать наибольшее из них, не меняя критерий сравнения.",
    },
}'''
          text = text[:start] + replacement + text[end:]
          text = text.replace('''def _gap_for_operation(task_number: int, operation_index: int) -> dict | None:\n    if task_number == 14:\n        return TASK14_GAPS.get(operation_index)\n    return None\n''', '''def _gap_for_operation(task_number: int, operation_index: int) -> dict | None:\n    return PILOT_GAPS.get((task_number, operation_index))\n''')
          old = '''    hypotheses = []\n    if task_number == 14:\n        hypotheses = [\n            {\n                **gap,\n                "operation_index": operation_index,\n                "status": "suspected",\n                "supporting_evidence": [],\n                "alternative_explanations": [\n                    "случайная вычислительная ошибка",\n                    "невнимательность",\n                    "непонятое обозначение в условии",\n                ],\n            }\n            for operation_index, gap in TASK14_GAPS.items()\n        ]\n'''
          new = '''    hypotheses = [\n        {\n            **gap,\n            "operation_index": operation_index,\n            "skill_id": diagnostic_skill_for_operation({"task_number": task_number, "skill_ids": task.get("skills", [])}, operation_index),\n            "status": "suspected",\n            "supporting_evidence": [],\n            "alternative_explanations": [\n                "случайная ошибка",\n                "невнимательность",\n                "непонятая формулировка задания",\n            ],\n        }\n        for (gap_task, operation_index), gap in PILOT_GAPS.items()\n        if gap_task == task_number\n    ]\n'''
          if old not in text:
              raise SystemExit('open_diagnostic_case hypothesis block not found')
          text = text.replace(old, new, 1)
          text = text.replace('''        updated["learning_action"] = f"Отработать шаг: {tested_step}."\n''', '''        updated["learning_action"] = (\n            f"Повторить правило: {gap['required_rule']}" if gap\n            else f"Отработать шаг: {tested_step}."\n        )\n''', 1)
          p.write_text(text, encoding='utf-8')

          t = Path('tests/test_ege_diagnostics.py')
          tests = t.read_text(encoding='utf-8')
          addition = '''\n\ndef test_all_pilot_operations_have_atomic_pedagogical_hypotheses():\n    full_map = json.loads(\n        (Path(__file__).parents[1] / "src" / "skills" / "ege_informatics_2026.json").read_text(encoding="utf-8")\n    )\n    expected_counts = {5: 4, 14: 3, 27: 4}\n    for task_number, expected_count in expected_counts.items():\n        case = open_diagnostic_case(task_number, "wrong", "expected", full_map)\n        hypotheses = case["gap_hypotheses"]\n        assert len(hypotheses) == expected_count\n        assert all(item.get("skill_id") for item in hypotheses)\n        assert all(item.get("description") for item in hypotheses)\n        assert all(item.get("required_rule") for item in hypotheses)\n        assert len({item["skill_id"] for item in hypotheses}) == expected_count\n\n\ndef test_task27_two_failed_bound_probes_confirm_exact_pedagogical_gap():\n    full_map = json.loads(\n        (Path(__file__).parents[1] / "src" / "skills" / "ege_informatics_2026.json").read_text(encoding="utf-8")\n    )\n    case = open_diagnostic_case(27, "wrong", "expected", full_map)\n    gap = case["gap_hypotheses"][1]\n    case = record_control_probe(\n        case, probe_id="medoid-a", tested_step=case["operations"][1], is_correct=False,\n        observed_answer="C", gap=gap, probe_role="discrimination"\n    )\n    case = record_control_probe(\n        case, probe_id="medoid-b", tested_step=case["operations"][1], is_correct=False,\n        observed_answer="A", gap=gap, probe_role="transfer"\n    )\n    assert case["status"] == DIAGNOSIS_CONFIRMED\n    confirmed = [item for item in case["gap_hypotheses"] if item["status"] == "confirmed"]\n    assert len(confirmed) == 1\n    assert confirmed[0]["skill_id"] == "programming.medoid_minimum"\n    assert "минимальной сумме расстояний" in confirmed[0]["description"]\n    assert "Медоид" in case["learning_action"]\n'''
          if 'test_all_pilot_operations_have_atomic_pedagogical_hypotheses' not in tests:
              tests += addition
          t.write_text(tests, encoding='utf-8')

          Path('.github/workflows/unify-pilot-pedagogy.yml').unlink()
          PY
      - name: Test diagnostic core
        env:
          BOT_TOKEN: 123456:TESTTOKEN
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install -r requirements.txt pytest
          pytest -q tests/test_ege_diagnostics.py tests/test_diagnostic_evidence_integrity.py tests/test_pilot_full_student_loop.py tests/test_pilot_full_telegram_loop.py tests/test_pilot_learning_dna_flow.py tests/test_task5_remediation.py tests/test_task27_remediation.py
      - name: Commit
        run: |
          git config user.name 'nikitinti-gif'
          git config user.email 'nikitinti@gmail.com'
          git add -A
          git commit -m 'Align pilot hypotheses with atomic student skills'
          git push origin HEAD:release/0.1-diagnostics
