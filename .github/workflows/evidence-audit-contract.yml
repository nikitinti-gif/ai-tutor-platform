name: One-shot evidence audit contract
on:
  push:
    branches: [release/0.1-diagnostics]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot evidence audit contract migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.1-diagnostics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add auditable evidence context
        run: |
          python - <<'PY'
          from pathlib import Path

          gate = Path('src/ai_engine/diagnostic_evidence_gate.py')
          text = gate.read_text(encoding='utf-8')
          text = text.replace('from copy import deepcopy\n', 'from copy import deepcopy\nfrom datetime import datetime, timezone\n', 1)
          text = text.replace(
              'def answer_bound_control_probe(case: dict, probe_id: str, answer: str) -> dict:\n',
              'def answer_bound_control_probe(\n    case: dict,\n    probe_id: str,\n    answer: str,\n    *,\n    student_id: int | str | None = None,\n    attempt_id: str | None = None,\n) -> dict:\n',
              1,
          )
          old = '''    evidence.update(\n        {\n            "base_probe_id": base_probe_id,\n            "question": pending.get("prompt") or probe["prompt"],\n            "canonical_question": pending.get("canonical_prompt") or probe["prompt"],\n            "canonical_answer": str(expected_answers[0]),\n            "accepted_answers": [str(value) for value in expected_answers],\n            "student_answer": answer,\n            "validator_result": is_correct,\n            "evidence_valid": True,\n            "probe_source": pending.get("source", "local_fallback"),\n        }\n    )\n'''
          new = '''    gap = _gap_for_operation(int(case.get("task_number", 0)), operation_index)\n    hypothesis_id = (gap or {}).get("gap_id") or f"task{case.get('task_number')}_operation{operation_index}"\n    evidence.update(\n        {\n            "student_id": str(student_id) if student_id is not None else "unbound",\n            "attempt_id": attempt_id or "unbound",\n            "task_number": int(case.get("task_number", 0)),\n            "skill_id": case.get("active_skill_id") or "unknown_skill",\n            "hypothesis_id": hypothesis_id,\n            "base_probe_id": base_probe_id,\n            "question": pending.get("prompt") or probe["prompt"],\n            "canonical_question": pending.get("canonical_prompt") or probe["prompt"],\n            "canonical_answer": str(expected_answers[0]),\n            "accepted_answers": [str(value) for value in expected_answers],\n            "student_answer": answer,\n            "validator_result": is_correct,\n            "timestamp": datetime.now(timezone.utc).isoformat(),\n            "evidence_valid": True,\n            "probe_source": pending.get("source", "local_fallback"),\n        }\n    )\n'''
          if old not in text:
              raise SystemExit('evidence update block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '''    required = (\n        "probe_id",\n        "question",\n        "canonical_answer",\n        "student_answer",\n        "validator_result",\n    )\n''',
              '''    required = (\n        "student_id",\n        "attempt_id",\n        "task_number",\n        "skill_id",\n        "hypothesis_id",\n        "probe_id",\n        "question",\n        "canonical_answer",\n        "student_answer",\n        "validator_result",\n        "timestamp",\n    )\n''',
              1,
          )
          gate.write_text(text, encoding='utf-8')

          service = Path('src/services/ege_exam_service.py')
          text = service.read_text(encoding='utf-8')
          text = text.replace(
              'def submit_diagnostic_answer(attempt: ExamAttempt, answer: str) -> dict:\n',
              'def submit_diagnostic_answer(\n    attempt: ExamAttempt,\n    answer: str,\n    *,\n    student_id: int | str | None = None,\n) -> dict:\n',
              1,
          )
          text = text.replace(
              '''    case = answer_bound_control_probe(\n        current_case,\n        probe["probe_id"],\n        answer,\n    )\n''',
              '''    case = answer_bound_control_probe(\n        current_case,\n        probe["probe_id"],\n        answer,\n        student_id=student_id,\n        attempt_id=attempt.attempt_id,\n    )\n''',
              1,
          )
          service.write_text(text, encoding='utf-8')

          student = Path('src/telegram_bot/handlers/student.py')
          text = student.read_text(encoding='utf-8')
          text = text.replace(
              '    result = submit_diagnostic_answer(attempt, message.text or "")\n',
              '    result = submit_diagnostic_answer(\n        attempt, message.text or "", student_id=message.from_user.id\n    )\n',
              1,
          )
          student.write_text(text, encoding='utf-8')

          integrity = Path('tests/test_diagnostic_evidence_integrity.py')
          text = integrity.read_text(encoding='utf-8')
          old = '    updated = answer_bound_control_probe(case, probe["probe_id"], "6")\n'
          new = '    updated = answer_bound_control_probe(\n        case, probe["probe_id"], "6", student_id=424242, attempt_id="attempt-audit-1"\n    )\n'
          if old not in text:
              raise SystemExit('integrity call not found')
          text = text.replace(old, new, 1)
          marker = '    assert evidence["evidence_valid"] is True\n'
          addition = '''    assert evidence["student_id"] == "424242"\n    assert evidence["attempt_id"] == "attempt-audit-1"\n    assert evidence["task_number"] == 14\n    assert evidence["skill_id"]\n    assert evidence["hypothesis_id"] == "BASE_REMAINDER_EXTRACTION"\n    assert evidence["timestamp"].endswith("+00:00")\n'''
          if marker not in text:
              raise SystemExit('integrity assertion marker not found')
          text = text.replace(marker, marker + addition, 1)
          integrity.write_text(text, encoding='utf-8')

          handler = Path('tests/test_student_diagnostic_handler_flow.py')
          text = handler.read_text(encoding='utf-8')
          marker = '        assert all(item.get("student_answer") is not None for item in control_evidence[-2:])\n'
          addition = '''        assert all(item.get("student_id") == "42" for item in control_evidence[-2:])\n        assert all(item.get("attempt_id") for item in control_evidence[-2:])\n        assert all(item.get("task_number") == task_number for item in control_evidence[-2:])\n        assert all(item.get("skill_id") for item in control_evidence[-2:])\n        assert all(item.get("hypothesis_id") for item in control_evidence[-2:])\n        assert all(item.get("timestamp") for item in control_evidence[-2:])\n'''
          if marker not in text:
              raise SystemExit('handler assertion marker not found')
          text = text.replace(marker, marker + addition, 1)
          handler.write_text(text, encoding='utf-8')

          Path('.github/workflows/evidence-audit-contract.yml').unlink()
          PY
      - name: Run diagnostic regression suite
        env:
          BOT_TOKEN: 123456:TESTTOKEN
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install -r requirements.txt pytest
          pytest -q tests/test_pilot_diagnostic_flow.py tests/test_ege_diagnostics.py tests/test_student_diagnostic_handler_flow.py tests/test_pilot_learning_dna_flow.py tests/test_probe_quality_gate.py tests/test_diagnostic_evidence_integrity.py
      - name: Commit evidence audit contract
        run: |
          git config user.name 'nikitinti-gif'
          git config user.email 'nikitinti@gmail.com'
          git add -A
          git commit -m 'Complete diagnostic evidence audit contract'
          git push origin HEAD:release/0.1-diagnostics
