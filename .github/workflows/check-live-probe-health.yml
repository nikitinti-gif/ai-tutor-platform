name: Check live EGE-like diagnostic probes
on:
  push:
    branches: [release/0.1-diagnostics]
permissions:
  contents: write
jobs:
  check:
    if: github.event.head_commit.message == 'Check live EGE-like diagnostic probes on Render'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.1-diagnostics
      - name: Wait for Render deploy and fetch live self-check
        run: |
          python - <<'PY'
          import json, time, urllib.request
          url = 'https://ai-tutor-platform.onrender.com/'
          last = None
          for i in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      data = json.load(r)
                  last = data
                  sc = data.get('live_diagnostic_self_check') or {}
                  print(json.dumps(data, ensure_ascii=False, indent=2))
                  if sc.get('status') != 'running':
                      break
              except Exception as e:
                  print(f'attempt {i+1}: {type(e).__name__}: {e}')
              time.sleep(15)
          if not last:
              raise SystemExit('Render health endpoint unavailable')
          sc = last.get('live_diagnostic_self_check') or {}
          if sc.get('status') == 'running':
              raise SystemExit('Live diagnostic self-check did not finish in time')
          print('LIVE_SELF_CHECK_STATUS=', sc.get('status'))
          for p in sc.get('probes', []):
              print(f"TASK {p.get('task_number')}.{p.get('operation_index')}: {p.get('prompt')}")
          if sc.get('passed') != sc.get('total'):
              raise SystemExit(f"Live AI probes not fully passed: {sc.get('passed')}/{sc.get('total')}")
          PY
      - name: Remove one-shot workflow
        if: success()
        run: |
          rm .github/workflows/check-live-probe-health.yml
          git config user.name 'nikitinti-gif'
          git config user.email 'nikitinti@gmail.com'
          git add -A
          git commit -m 'Remove completed live probe health check'
          git push origin HEAD:release/0.1-diagnostics
