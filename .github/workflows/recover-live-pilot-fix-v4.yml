name: Finalize live pilot task5 remediation fix
on:
  push:
    branches: [release/0.1-diagnostics]
permissions:
  contents: write
jobs:
  recover:
    if: github.event.head_commit.message == 'Finalize live pilot task5 remediation fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.1-diagnostics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply migration and regression correction
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/live-pilot-remediation-fix.yml').read_text()
          body = source.split("python - <<'PY'\n", 1)[1].split('\n          PY', 1)[0]
          out, triple = [], False
          for line in body.splitlines():
              out.append(line if triple else (line[10:] if line.startswith('          ') else line))
              if line.count("'''") % 2 == 1:
                  triple = not triple
          exec(compile('\n'.join(out), 'recovered_migration.py', 'exec'))
          test = Path('tests/test_task5_remediation.py')
          text = test.read_text()
          text = text.replace('        case = apply_live_probe(case, probe)\n        case = answer_bound_control_probe(', '        case = apply_live_probe(case, probe)\n        case["pending_probe"]["displayed"] = True\n        case = answer_bound_control_probe(', 1)
          test.write_text(text)
          PY
      - name: Run regression suite
        env:
          BOT_TOKEN: 123456:TESTTOKEN
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install -r requirements.txt pytest
          python -m py_compile src/services/ege_exam_service.py src/telegram_bot/handlers/student.py
          pytest -q tests/test_task5_remediation.py tests/test_task27_remediation.py tests/test_pilot_full_student_loop.py tests/test_pilot_full_telegram_loop.py tests/test_pilot_learning_dna_flow.py tests/test_diagnostic_evidence_integrity.py tests/test_student_diagnostic_handler_flow.py
      - name: Commit fix
        run: |
          rm -f .github/workflows/live-pilot-remediation-fix.yml .github/workflows/recover-live-pilot-fix.yml .github/workflows/recover-live-pilot-fix-v2.yml .github/workflows/recover-live-pilot-fix-v3.yml .github/workflows/recover-live-pilot-fix-v4.yml
          git config user.name 'nikitinti-gif'
          git config user.email 'nikitinti@gmail.com'
          git add -A
          git commit -m 'Teach confirmed task5 gaps before later remediation'
          git push origin HEAD:release/0.1-diagnostics
