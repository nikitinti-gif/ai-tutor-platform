name: Pilot diagnostics

on:
  push:
    branches:
      - release/0.1-diagnostics
    paths:
      - "src/ai_engine/**"
      - "src/learning_dna/**"
      - "src/services/ege_exam_service.py"
      - "src/telegram_bot/handlers/student.py"
      - "src/skills/**"
      - "tests/test_ege_diagnostics.py"
      - "tests/test_pilot_diagnostic_flow.py"
      - "tests/test_pilot_learning_dna_flow.py"
      - "tests/test_student_diagnostic_handler_flow.py"
      - "tests/test_pilot_full_student_loop.py"
      - "tests/test_pilot_full_telegram_loop.py"
      - "tests/test_probe_quality_gate.py"
      - "tests/test_diagnostic_evidence_integrity.py"
      - ".github/workflows/pilot-diagnostics.yml"
  workflow_dispatch:

jobs:
  pilot-diagnostics:
    runs-on: ubuntu-24.04
    env:
      BOT_TOKEN: "123456:TESTTOKEN"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run pilot diagnostic regression tests
        run: |
          pytest -q tests/test_pilot_diagnostic_flow.py tests/test_ege_diagnostics.py tests/test_student_diagnostic_handler_flow.py tests/test_pilot_learning_dna_flow.py tests/test_pilot_full_student_loop.py tests/test_pilot_full_telegram_loop.py tests/test_probe_quality_gate.py tests/test_diagnostic_evidence_integrity.py
