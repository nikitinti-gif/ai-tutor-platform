name: One-shot live pilot remediation fix
on:
  push:
    branches: [release/0.1-diagnostics]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot live pilot remediation fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.1-diagnostics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix remediation ordering exposed by live Telegram run
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('src/services/ege_exam_service.py')
          text = service.read_text(encoding='utf-8')
          anchor = '\n\nTASK14_REMEDIATION = {'
          block = r'''

TASK5_REMEDIATION = {
    "number_systems.decimal_binary_conversion": {
        "explanation": "Чтобы перевести десятичное число в двоичное, последовательно дели его на 2 и читай остатки снизу вверх.",
        "example": "Например, 13 = 1101₂: 13→6 остаток 1, 6→3 остаток 0, 3→1 остаток 1, затем старшая 1.",
        "hint": "Дели на 2, записывай остатки 0/1 и прочитай их в обратном порядке.",
        "control_prompt": "Контроль: переведи 10 из десятичной системы в двоичную.",
        "control_answers": ("1010",),
        "retest_prompt": "Перенос: переведи 25 из десятичной системы в двоичную.",
        "retest_answers": ("11001",),
        "verification_prompt": "Независимая проверка без подсказки: переведи 42 из десятичной системы в двоичную.",
        "verification_answers": ("101010",),
    },
    "algorithms.branch_from_last_bit": {
        "explanation": "Младший бит — последняя цифра двоичной записи. Именно по нему выбирается ветка алгоритма.",
        "example": "У 101101 последний бит 1, значит выбирается ветка для 1.",
        "hint": "Смотри только на крайнюю правую цифру двоичной записи.",
        "control_prompt": "Контроль: у записи 110010 какой младший бит?",
        "control_answers": ("0",),
        "retest_prompt": "Перенос: у записи 101011 какой младший бит?",
        "retest_answers": ("1",),
        "verification_prompt": "Независимая проверка: у записи 111100 какой младший бит?",
        "verification_answers": ("0",),
    },
    "algorithms.binary_suffix_append": {
        "explanation": "Приписать суффикс справа — значит оставить исходную двоичную запись без изменений и добавить указанные биты в конец.",
        "example": "К 101 приписать 11 → 10111.",
        "hint": "Не складывай числа: просто добавь указанные символы справа.",
        "control_prompt": "Контроль: к двоичной записи 1101 припиши справа 0.",
        "control_answers": ("11010",),
        "retest_prompt": "Перенос: к записи 1010 припиши справа 11.",
        "retest_answers": ("101011",),
        "verification_prompt": "Независимая проверка: к записи 11100 припиши справа 1.",
        "verification_answers": ("111001",),
    },
    "algorithms.integer_boundary_inequality": {
        "explanation": "Для строгого неравенства сначала найди границу, затем выбери наибольшее целое, которое всё ещё удовлетворяет знаку <.",
        "example": "3N+2<20 → N<6, значит наибольшее целое N равно 5.",
        "hint": "Реши неравенство и отдельно проверь ближайшее целое у границы.",
        "control_prompt": "Контроль: какое наибольшее целое N удовлетворяет 2N+1<12?",
        "control_answers": ("5",),
        "retest_prompt": "Перенос: какое наибольшее целое N удовлетворяет 4N+3<28?",
        "retest_answers": ("6",),
        "verification_prompt": "Независимая проверка: какое наибольшее целое N удовлетворяет 5N+2<38?",
        "verification_answers": ("7",),
    },
}


def _confirmed_task5_skill(attempt: ExamAttempt) -> str | None:
    case = attempt.diagnostics.get(5, {})
    if case.get("status") != "confirmed":
        return None
    for evidence in reversed(case.get("evidence", [])):
        skill_id = evidence.get("skill_id")
        if skill_id in TASK5_REMEDIATION and evidence.get("evidence_valid") is True and not evidence.get("is_correct"):
            return skill_id
    return None


def start_task5_remediation(attempt: ExamAttempt) -> dict | None:
    if attempt.remediation:
        return attempt.remediation
    skill_id = _confirmed_task5_skill(attempt)
    if not skill_id:
        return None
    attempt.remediation = {
        "task_number": 5, "skill_id": skill_id, "status": "remediating", "stage": "control",
        "control_attempts": 0, "retest_attempts": 0, "verification_attempts": 0,
        "learning_round": 1, "stage_history": [],
    }
    return attempt.remediation


def render_task5_remediation(attempt: ExamAttempt, *, include_lesson: bool | None = None) -> str:
    remediation = attempt.remediation
    lesson = TASK5_REMEDIATION[remediation["skill_id"]]
    stage = remediation["stage"]
    if stage == "control":
        if include_lesson is None:
            include_lesson = remediation["control_attempts"] == 0
        intro = ""
        if include_lesson:
            intro = "━━━━━━━━━━━━━━━━━━━━\n🧭 КОРОТКОЕ ОБУЧЕНИЕ · №5\n━━━━━━━━━━━━━━━━━━━━\n\nПравило: " + lesson["explanation"] + "\n\nРазобранный пример: " + lesson["example"] + "\n\n"
        elif remediation["control_attempts"]:
            intro = "💡 Подсказка: " + lesson["hint"] + "\n\nПравило ещё раз: " + lesson["explanation"] + "\n\n"
        return intro + lesson["control_prompt"] + "\n\nОтправь только ответ."
    if stage == "verification":
        return "━━━━━━━━━━━━━━━━━━━━\n🎯 НЕЗАВИСИМАЯ ПРОВЕРКА · №5\n━━━━━━━━━━━━━━━━━━━━\n\nЗдесь нет подсказки; данные отличаются от примеров.\n\n" + lesson["verification_prompt"] + "\n\nОтправь только ответ."
    intro = ""
    if remediation["retest_attempts"]:
        intro = "💡 Примени то же правило к новым данным.\n" + lesson["hint"] + "\n\n"
    return intro + lesson["retest_prompt"] + "\n\nОтправь только ответ."


def submit_task5_remediation_answer(attempt: ExamAttempt, answer: str) -> dict:
    remediation = attempt.remediation
    if not remediation or remediation.get("task_number") != 5 or remediation.get("status") not in {"remediating", "retesting"}:
        raise ValueError("Обучающий цикл №5 не запущен.")
    lesson = TASK5_REMEDIATION[remediation["skill_id"]]
    stage = remediation["stage"]
    normalized = answer.strip().lower().replace("ё", "е")
    expected = {item.lower().replace("ё", "е") for item in lesson[f"{stage}_answers"]}
    remediation[f"{stage}_attempts"] += 1
    is_correct = normalized in expected
    remediation.setdefault("stage_history", []).append({
        "stage": stage, "question": lesson[f"{stage}_prompt"],
        "canonical_answer": str(lesson[f"{stage}_answers"][0]), "student_answer": answer,
        "validator_result": is_correct, "is_correct": is_correct,
        "learning_round": remediation.get("learning_round", 1), "timestamp": time.time(),
    })
    if is_correct and stage == "control":
        remediation["stage"] = "retest"
    elif is_correct and stage == "retest":
        remediation["status"] = "retesting"; remediation["stage"] = "verification"
    elif is_correct:
        remediation["status"] = "mastered"; remediation["stage"] = "completed"
    elif stage == "verification":
        remediation["status"] = "remediating"; remediation["stage"] = "control"
        remediation["control_attempts"] = 0; remediation["retest_attempts"] = 0
        remediation["learning_round"] += 1
    return {"is_correct": is_correct, "status": remediation["status"], "stage": remediation["stage"]}
'''
          if anchor not in text:
              raise SystemExit('TASK14 anchor missing')
          text = text.replace(anchor, block + anchor, 1)
          service.write_text(text, encoding='utf-8')

          handler = Path('src/telegram_bot/handlers/student.py')
          text = handler.read_text(encoding='utf-8')
          text = text.replace('''        render_task14_remediation,\n        start_task14_remediation,\n''', '''        render_task5_remediation,\n        start_task5_remediation,\n        render_task14_remediation,\n        start_task14_remediation,\n''', 1)
          text = text.replace('''    remediation = start_task14_remediation(attempt)\n    if not remediation:\n        remediation = start_task27_remediation(attempt)\n''', '''    remediation = start_task5_remediation(attempt)\n    if not remediation:\n        remediation = start_task14_remediation(attempt)\n    if not remediation:\n        remediation = start_task27_remediation(attempt)\n''', 1)
          text = text.replace('''        renderer = render_task14_remediation if remediation["task_number"] == 14 else render_task27_remediation\n''', '''        renderer = {5: render_task5_remediation, 14: render_task14_remediation, 27: render_task27_remediation}[int(remediation["task_number"])]\n''', 1)
          text = text.replace('''        render_task14_remediation,\n        submit_task14_remediation_answer,\n''', '''        render_task5_remediation,\n        submit_task5_remediation_answer,\n        start_task5_remediation,\n        render_task14_remediation,\n        submit_task14_remediation_answer,\n        start_task14_remediation,\n''', 1)
          old = '''    submitter = submit_task14_remediation_answer if remediation_task == 14 else submit_task27_remediation_answer\n    renderer = render_task14_remediation if remediation_task == 14 else render_task27_remediation\n'''
          new = '''    submitter = {5: submit_task5_remediation_answer, 14: submit_task14_remediation_answer, 27: submit_task27_remediation_answer}[remediation_task]\n    renderer = {5: render_task5_remediation, 14: render_task14_remediation, 27: render_task27_remediation}[remediation_task]\n'''
          if old not in text:
              raise SystemExit('submitter block missing')
          text = text.replace(old, new, 1)
          old = '''    if result["status"] == "mastered":\n        if remediation_task == 14:\n            attempt.remediation = {}\n            next_remediation = start_task27_remediation(attempt)\n            if next_remediation:\n                if dna:\n                    dna = set_ege_remediation_status(dna, 27, "remediating")\n                    LearningDNARepository.save(message.from_user.id, dna)\n                save_ege_session(message.from_user.id, attempt.to_dict(), status="remediation_in_progress")\n                await state.update_data(ege_attempt=attempt.to_dict())\n                await message.answer("✅ Навык №14 подтверждён. Переходим к следующему доказанному пробелу — №27.")\n                await message.answer(render_task27_remediation(attempt, include_lesson=True))\n                return\n'''
          new = '''    if result["status"] == "mastered":\n        attempt.remediation = {}\n        starters = ((5, start_task5_remediation, render_task5_remediation), (14, start_task14_remediation, render_task14_remediation), (27, start_task27_remediation, render_task27_remediation))\n        next_remediation = None\n        next_renderer = None\n        for task_no, starter, candidate_renderer in starters:\n            if task_no <= remediation_task:\n                continue\n            next_remediation = starter(attempt)\n            if next_remediation:\n                next_renderer = candidate_renderer\n                break\n        if next_remediation:\n            next_task = int(next_remediation["task_number"])
            if dna:\n                dna = set_ege_remediation_status(dna, next_task, "remediating")\n                LearningDNARepository.save(message.from_user.id, dna)\n            save_ege_session(message.from_user.id, attempt.to_dict(), status="remediation_in_progress")\n            await state.update_data(ege_attempt=attempt.to_dict())\n            await message.answer(f"✅ Навык №{remediation_task} подтверждён. Переходим к следующему доказанному пробелу — №{next_task}.")\n            await message.answer(next_renderer(attempt, include_lesson=True))\n            return\n'''
          if old not in text:
              raise SystemExit('mastered transition block missing')
          text = text.replace(old, new, 1)
          old = '''        from src.services.ege_exam_service import render_task14_remediation, render_task27_remediation\n\n        attempt = ExamAttempt.from_dict(saved.get("attempt"))\n        task_number = int((attempt.remediation or {}).get("task_number", 14))\n        renderer = render_task14_remediation if task_number == 14 else render_task27_remediation\n'''
          new = '''        from src.services.ege_exam_service import render_task5_remediation, render_task14_remediation, render_task27_remediation\n\n        attempt = ExamAttempt.from_dict(saved.get("attempt"))\n        task_number = int((attempt.remediation or {}).get("task_number", 14))\n        renderer = {5: render_task5_remediation, 14: render_task14_remediation, 27: render_task27_remediation}[task_number]\n'''
          if old not in text:
              raise SystemExit('resume renderer block missing')
          text = text.replace(old, new, 1)
          handler.write_text(text, encoding='utf-8')

          test = Path('tests/test_task5_remediation.py')
          test.write_text(r'''from src.ai_engine.diagnostics import apply_live_probe, next_control_probe, open_diagnostic_case
from src.ai_engine.diagnostic_evidence_gate import answer_bound_control_probe
from src.services.ege_exam_service import TASK5_REMEDIATION, ExamAttempt, render_task5_remediation, start_task5_remediation, submit_task5_remediation_answer
from src.skills.skill_graph import load_skill_map


def _confirmed_task5_attempt():
    attempt = ExamAttempt()
    case = open_diagnostic_case(5, "wrong", "expected", load_skill_map())
    for answer in ("wrong-1", "wrong-2"):
        probe = next_control_probe(case)
        case = apply_live_probe(case, probe)
        case = answer_bound_control_probe(case, probe["probe_id"], answer, student_id=42, attempt_id=attempt.attempt_id)
    attempt.diagnostics[5] = case
    return attempt


def test_task5_confirmed_atomic_skill_is_taught_before_later_tasks():
    attempt = _confirmed_task5_attempt()
    remediation = start_task5_remediation(attempt)
    assert remediation["task_number"] == 5
    assert remediation["skill_id"] == "number_systems.decimal_binary_conversion"
    assert "КОРОТКОЕ ОБУЧЕНИЕ · №5" in render_task5_remediation(attempt, include_lesson=True)
    lesson = TASK5_REMEDIATION[remediation["skill_id"]]
    for stage in ("control", "retest", "verification"):
        assert attempt.remediation["stage"] == stage
        result = submit_task5_remediation_answer(attempt, lesson[f"{stage}_answers"][0])
    assert result["status"] == "mastered"
    assert [item["stage"] for item in attempt.remediation["stage_history"]] == ["control", "retest", "verification"]
''', encoding='utf-8')

          Path('.github/workflows/live-pilot-remediation-fix.yml').unlink()
          PY
      - name: Run regression suite
        env:
          BOT_TOKEN: 123456:TESTTOKEN
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install -r requirements.txt pytest
          pytest -q tests/test_task5_remediation.py tests/test_task27_remediation.py tests/test_pilot_full_student_loop.py tests/test_pilot_full_telegram_loop.py tests/test_pilot_learning_dna_flow.py tests/test_diagnostic_evidence_integrity.py tests/test_student_diagnostic_handler_flow.py
      - name: Commit fix
        run: |
          git config user.name 'nikitinti-gif'
          git config user.email 'nikitinti@gmail.com'
          git add -A
          git commit -m 'Teach confirmed task5 gaps before later remediation'
          git push origin HEAD:release/0.1-diagnostics
