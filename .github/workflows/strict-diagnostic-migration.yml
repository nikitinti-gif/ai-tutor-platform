name: One-shot migrate strict diagnostic submit
on:
  push:
    branches: [release/0.1-diagnostics]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot strict diagnostic migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.1-diagnostics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch strict evidence path
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('src/services/ege_exam_service.py')
          text = service.read_text(encoding='utf-8')
          marker = 'from src.ai_engine.verification_engine import VerificationResult, verify_answer\n'
          addition = 'from src.ai_engine.diagnostic_evidence_gate import answer_bound_control_probe\n'
          if addition not in text:
              text = text.replace(marker, addition + marker)
          old = '''    case = answer_control_probe(\n        attempt.diagnostics[task_number],\n        probe["probe_id"],\n        answer,\n    )\n'''
          new = '''    current_case = attempt.diagnostics[task_number]\n    if current_case.get("pending_probe"):\n        case = answer_bound_control_probe(\n            current_case,\n            probe["probe_id"],\n            answer,\n        )\n    else:\n        # Transitional compatibility for internal callers that have not yet\n        # modelled the display step. This evidence is intentionally legacy\n        # and cannot pass the Learning DNA evidence gate.\n        case = answer_control_probe(\n            current_case,\n            probe["probe_id"],\n            answer,\n        )\n'''
          if old not in text:
              raise SystemExit('submit_diagnostic_answer block not found')
          text = text.replace(old, new, 1)
          service.write_text(text, encoding='utf-8')

          pilot = Path('tests/test_pilot_learning_dna_flow.py')
          text = pilot.read_text(encoding='utf-8')
          text = text.replace('from src.ai_engine.diagnostics import CONTROL_PROBES\n', 'from src.ai_engine.diagnostics import CONTROL_PROBES, apply_live_probe\n')
          text = text.replace('    first = submit_diagnostic_answer(attempt, "definitely-wrong")\n', '    attempt.diagnostics[task_number] = apply_live_probe(attempt.diagnostics[task_number], probe)\n    first = submit_diagnostic_answer(attempt, "definitely-wrong")\n', 1)
          text = text.replace('    second = submit_diagnostic_answer(attempt, "still-wrong")\n', '    attempt.diagnostics[task_number] = apply_live_probe(attempt.diagnostics[task_number], transfer)\n    second = submit_diagnostic_answer(attempt, "still-wrong")\n', 1)
          text = text.replace('    result = submit_diagnostic_answer(attempt, correct_answer)\n', '    attempt.diagnostics[probe["task_number"]] = apply_live_probe(\n        attempt.diagnostics[probe["task_number"]], probe\n    )\n    result = submit_diagnostic_answer(attempt, correct_answer)\n', 1)
          pilot.write_text(text, encoding='utf-8')

          diag = Path('tests/test_ege_diagnostics.py')
          text = diag.read_text(encoding='utf-8')
          if 'from src.ai_engine.diagnostic_evidence_gate import answer_bound_control_probe\n' not in text:
              text = text.replace('from src.learning_dna.engine import apply_confirmed_ege_diagnostics\n', 'from src.learning_dna.engine import apply_confirmed_ege_diagnostics\nfrom src.ai_engine.diagnostic_evidence_gate import answer_bound_control_probe\n')
          text = text.replace('    apply_ai_probe_wording,\n', '    apply_ai_probe_wording,\n    apply_live_probe,\n', 1)
          helper = '''\n\ndef _answer_displayed_probe(case: dict, probe_id: str, answer: str) -> dict:\n    """Test helper: explicitly model that the exact probe was displayed."""\n    probe = next_control_probe(case)\n    assert probe is not None\n    assert probe["probe_id"] == probe_id\n    case = apply_live_probe(case, probe)\n    return answer_bound_control_probe(case, probe_id, answer)\n'''
          anchor = '\n\ndef test_wrong_final_answer_does_not_invent_failed_step():'
          if helper.strip() not in text:
              text = text.replace(anchor, helper + anchor, 1)
          targets = ['test_confirmed_ege_evidence_is_applied_to_learning_dna_exactly_once', 'test_remediation_status_updates_existing_task14_plan', 'test_verified_task14_remediation_marks_skill_mastered_once']
          for name in targets:
              start = text.index(f'def {name}')
              next_def = text.find('\ndef ', start + 4)
              if next_def == -1:
                  next_def = len(text)
              block = text[start:next_def].replace('answer_control_probe(', '_answer_displayed_probe(')
              text = text[:start] + block + text[next_def:]
          diag.write_text(text, encoding='utf-8')

          Path('.github/workflows/strict-diagnostic-migration.yml').unlink()
          PY
      - name: Run diagnostic regression suite
        env:
          BOT_TOKEN: 123456:TESTTOKEN
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install -r requirements.txt pytest
          pytest -q tests/test_pilot_diagnostic_flow.py tests/test_ege_diagnostics.py tests/test_student_diagnostic_handler_flow.py tests/test_pilot_learning_dna_flow.py tests/test_probe_quality_gate.py tests/test_diagnostic_evidence_integrity.py
      - name: Commit migration
        run: |
          git config user.name 'nikitinti-gif'
          git config user.email 'nikitinti@gmail.com'
          git add -A
          git commit -m 'Route displayed diagnostic probes through evidence gate'
          git push origin HEAD:release/0.1-diagnostics
