name: Repair diagnostic delivery migration
on:
  push:
    branches: [release/0.1-diagnostics]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == 'Repair delivery acknowledgement migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.1-diagnostics
      - name: Fix transfer-probe test migration and retrigger
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/diagnostic-delivery-ack.yml')
          text = path.read_text(encoding='utf-8')
          needle = """          text = text.replace('    attempt.diagnostics[task_number] = apply_live_probe(attempt.diagnostics[task_number], probe)\\n', '    attempt.diagnostics[task_number] = apply_live_probe(attempt.diagnostics[task_number], probe)\\n    attempt.diagnostics[task_number][\"pending_probe\"][\"displayed\"] = True\\n')\n"""
          addition = """          text = text.replace('    attempt.diagnostics[task_number] = apply_live_probe(attempt.diagnostics[task_number], transfer)\\n    second = submit_diagnostic_answer(attempt, \"still-wrong\")\\n', '    attempt.diagnostics[task_number] = apply_live_probe(attempt.diagnostics[task_number], transfer)\\n    attempt.diagnostics[task_number][\"pending_probe\"][\"displayed\"] = True\\n    second = submit_diagnostic_answer(attempt, \"still-wrong\")\\n', 1)\n"""
          if addition not in text:
              if needle not in text:
                  raise SystemExit('learning test migration insertion point not found')
              text = text.replace(needle, needle + addition, 1)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/fix-delivery-ack.yml').unlink()
          PY
      - name: Commit repair and retrigger migration
        run: |
          git config user.name 'nikitinti-gif'
          git config user.email 'nikitinti@gmail.com'
          git add -A
          git commit -m 'Add one-shot diagnostic delivery acknowledgement'
          git push origin HEAD:release/0.1-diagnostics
