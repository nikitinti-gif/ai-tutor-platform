name: Verify curated EGE task bank v1
on:
  push:
    branches: [release/0.1-diagnostics]
permissions:
  contents: write
jobs:
  test:
    if: ${{ github.event.head_commit.message == 'Verify curated EGE task bank v1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.1-diagnostics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests/test_ege_task_bank.py tests/test_ege_learning_path.py tests/test_skill_graph.py
        env:
          BOT_TOKEN: 123456:TESTTOKEN
          PYTHONPATH: ${{ github.workspace }}
      - run: |
          rm .github/workflows/verify-ege-task-bank.yml
          git config user.name 'nikitinti-gif'
          git config user.email 'nikitinti@gmail.com'
          git add -A
          git commit -m 'Add curated EGE task bank v1'
          git push origin HEAD:release/0.1-diagnostics
