name: Verify task14 independent mastery transfer
on:
  push:
    branches: [release/0.1-diagnostics]
permissions:
  contents: write
jobs:
  test:
    if: ${{ github.event.head_commit.message == 'Verify task14 independent mastery transfer' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.1-diagnostics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests/test_ege_learning_path.py tests/test_student_diagnostic_handler_flow.py tests/test_ege_tutor_pilot.py tests/test_pilot_full_telegram_loop.py tests/test_skill_graph.py
        env:
          BOT_TOKEN: 123456:TESTTOKEN
          PYTHONPATH: ${{ github.workspace }}
      - run: |
          rm .github/workflows/verify-task14-independent-transfer.yml
          git config user.name 'nikitinti-gif'
          git config user.email 'nikitinti@gmail.com'
          git add -A
          git commit -m 'Require unseen exam transfer for task14 mastery'
          git push origin HEAD:release/0.1-diagnostics
