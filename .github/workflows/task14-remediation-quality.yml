name: One-shot task14 remediation quality
on:
  push:
    branches: [release/0.1-diagnostics]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot task14 remediation quality migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.1-diagnostics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Improve task14 teaching cycle
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/services/ege_exam_service.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '        "example": "Например: 130 = 3 × 36 + 22, поэтому первый остаток равен 22.",\n'
              '        "hint": "Представь 200 как 36 × q + r, где остаток r меньше 36.",\n'
              '        "control_prompt": "Контроль: чему равен первый остаток при делении 200 на 36?",\n'
              '        "control_answers": ("20",),\n'
              '        "retest_prompt": (\n'
              '            "Возврат к заданию типа №14: число 1298 переводят в 36-ричную "\n'
              '            "систему. Какой остаток получится на первом шаге?"\n'
              '        ),\n'
              '        "retest_answers": ("2",),\n'
              '        "verification_prompt": (\n'
              '            "Независимая проверка: число 777 переводят в 36-ричную систему. "\n'
              '            "Какой остаток получится на первом шаге?"\n'
              '        ),\n'
              '        "verification_answers": ("21",),\n',
              '        "example": "Например: 83 = 13 × 6 + 5, поэтому первый остаток равен 5.",\n'
              '        "hint": "Представь число как base × q + r, где 0 ≤ r < base.",\n'
              '        "control_prompt": "Контроль: чему равен остаток при делении 74 на 6?",\n'
              '        "control_answers": ("2",),\n'
              '        "retest_prompt": (\n'
              '            "Перенос: число 95 переводят в систему с основанием 7. "\n'
              '            "Какой остаток получится на первом шаге?"\n'
              '        ),\n'
              '        "retest_answers": ("4",),\n'
              '        "verification_prompt": (\n'
              '            "Независимая проверка без подсказки: число 143 переводят в систему "\n'
              '            "с основанием 9. Какой остаток получится на первом шаге?"\n'
              '        ),\n'
              '        "verification_answers": ("8",),\n',
              1,
          )
          text = text.replace(
              '        "learning_round": 1,\n',
              '        "learning_round": 1,\n        "stage_history": [],\n',
              1,
          )
          old = '''    remediation[f"{stage}_attempts"] += 1\n    is_correct = normalized in expected\n'''
          new = '''    remediation[f"{stage}_attempts"] += 1\n    is_correct = normalized in expected\n    remediation.setdefault("stage_history", []).append({\n        "stage": stage,\n        "student_answer": answer,\n        "is_correct": is_correct,\n        "learning_round": remediation.get("learning_round", 1),\n    })\n'''
          if old not in text:
              raise SystemExit('remediation answer block not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          t = Path('tests/test_ege_diagnostics.py')
          text = t.read_text(encoding='utf-8')
          anchor = '\n\ndef test_remediation_status_updates_existing_task14_plan():'
          addition = '''\n\ndef test_task14_remainder_remediation_uses_simple_numeric_ladder():\n    attempt = ExamAttempt(current_task=28)\n    attempt.diagnostics[14] = {\n        "status": "confirmed",\n        "evidence": [{"gap_id": "BASE_REMAINDER_EXTRACTION", "is_correct": False}],\n    }\n    remediation = ege_exam_service.start_task14_remediation(attempt)\n    assert remediation is not None\n    rendered = ege_exam_service.render_task14_remediation(attempt, include_lesson=True)\n    assert "83 = 13 × 6 + 5" in rendered\n    assert "74 на 6" in rendered\n    assert "основанием 36" not in rendered\n\n    first = ege_exam_service.submit_task14_remediation_answer(attempt, "2")\n    assert first["is_correct"] is True\n    assert attempt.remediation["stage"] == "retest"\n    assert "95" in ege_exam_service.render_task14_remediation(attempt)\n\n    second = ege_exam_service.submit_task14_remediation_answer(attempt, "4")\n    assert second["is_correct"] is True\n    assert attempt.remediation["stage"] == "verification"\n    assert "143" in ege_exam_service.render_task14_remediation(attempt)\n\n    third = ege_exam_service.submit_task14_remediation_answer(attempt, "8")\n    assert third["status"] == "mastered"\n    assert [item["stage"] for item in attempt.remediation["stage_history"]] == [\n        "control", "retest", "verification"\n    ]\n'''
          if addition.strip() not in text:
              text = text.replace(anchor, addition + anchor, 1)
          t.write_text(text, encoding='utf-8')

          Path('.github/workflows/task14-remediation-quality.yml').unlink()
          PY
      - name: Run diagnostic regression suite
        env:
          BOT_TOKEN: 123456:TESTTOKEN
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install -r requirements.txt pytest
          pytest -q tests/test_ege_diagnostics.py tests/test_pilot_learning_dna_flow.py tests/test_student_diagnostic_handler_flow.py tests/test_probe_quality_gate.py tests/test_diagnostic_evidence_integrity.py
      - name: Commit remediation quality improvements
        run: |
          git config user.name 'nikitinti-gif'
          git config user.email 'nikitinti@gmail.com'
          git add -A
          git commit -m 'Improve task14 remediation learning ladder'
          git push origin HEAD:release/0.1-diagnostics
